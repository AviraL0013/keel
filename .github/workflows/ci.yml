name: Eyeler checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run server:typecheck
      - run: npm run build
      - run: npm run smoke:prod

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test

  container:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t eyeler-ci .
      - name: Start, probe, and stop sandbox
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f eyeler-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --init --name eyeler-smoke -p 127.0.0.1:18787:8787 \
            -e EYELER_ENV=test -e EYELER_TEST_VENUE=true \
            -e SESSION_SECRET=ci-sandbox-only eyeler-ci
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18787/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker stop -t 30 eyeler-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' eyeler-smoke)" = 0
          docker logs eyeler-smoke 2>&1 | grep -F 'EYELER shutdown complete'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
