name: Eyeler checks
on:
  push:
    branches: [main, '**']
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run server:typecheck
      - run: npm run build
      - run: npm run smoke:prod

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      - name: Preserve failed screenshot evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures
          path: apps/mobile/test/**/failures/**
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: eyeler-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Compile mainnet onboarding and activation
        run: flutter build apk --debug --dart-define=EYELER_DEPLOYMENT=mainnet --dart-define=EYELER_API_URL=https://api-mainnet-production-b042.up.railway.app --dart-define=EYELER_BUILD_SHA=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: eyeler-mainnet-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t eyeler-ci .
      - name: Start, probe, and stop sandbox
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f eyeler-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --init --name eyeler-smoke -p 127.0.0.1:18787:8787 \
            -e EYELER_ENV=test -e EYELER_TEST_VENUE=true \
            -e SESSION_SECRET=ci-sandbox-only eyeler-ci
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18787/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker stop -t 30 eyeler-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' eyeler-smoke)" = 0
          docker logs eyeler-smoke 2>&1 | grep -F 'EYELER shutdown complete'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

  deploy_web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, flutter, android, container, secrets]
    runs-on: ubuntu-latest
    concurrency:
      group: eyeler-web-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Build live web app
        env:
          EYELER_BUILD_SHA: ${{ github.sha }}
        run: |
          sh scripts/deploy/build-web.sh mainnet
          mkdir -p build/eyeler-app
          cp -R apps/mobile/build/web/. build/eyeler-app/
      - name: Build sandbox web app
        env:
          EYELER_BUILD_SHA: ${{ github.sha }}
        run: |
          sh scripts/deploy/build-web.sh sandbox
          mkdir -p build/eyeler-sandbox
          cp -R apps/mobile/build/web/. build/eyeler-sandbox/
      - name: Deploy live app to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_APP_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_APP_PROJECT_ID }}
        run: npx --yes vercel@62.2.0 deploy build/eyeler-app --prod --yes --token "$VERCEL_TOKEN" --project "$VERCEL_PROJECT_ID"
      - name: Deploy sandbox app to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_SANDBOX_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SANDBOX_PROJECT_ID }}
        run: npx --yes vercel@62.2.0 deploy build/eyeler-sandbox --prod --yes --token "$VERCEL_TOKEN" --project "$VERCEL_PROJECT_ID"
